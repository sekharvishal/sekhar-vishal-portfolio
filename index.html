      property="og:description"

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sekhar Vishal",
        "jobTitle": "Full Stack Java Developer",
        "worksFor": { "@type": "Organization", "name": "SecureW2" },
        "alumniOf": "Mother Theresa Institute of Engineering and Technology",
        "knowsAbout": ["Java", "Spring Boot", "Angular", "REST APIs", "MySQL", "MongoDB", "RabbitMQ", "AWS Lambda", "Generative AI"]
      }
    </script>

    <script>
      // Apply the stored / system theme before first paint to avoid a flash.
      try {
        var stored = localStorage.getItem('sv-theme')
        var theme = stored === 'light' || stored === 'dark' ? stored : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Sekhar Vishal, Full Stack Java Developer (Java, Spring Boot, Angular, Cloud, AI). Please enable JavaScript to view
        the full portfolio.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
